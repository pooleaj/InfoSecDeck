name: Daily Job Ingest

on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC every day
  workflow_dispatch:       # Allow manual trigger from GitHub Actions UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingest-remote-jobs
        run: |
          curl -s -X POST \
            "https://eaynqvgeqdnaswwuwbha.supabase.co/functions/v1/ingest-remote-jobs" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail-with-body
