<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OG Image — Option A: Terminal Signal</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Exact OG dimensions: 1200 × 630 */
  body { margin: 0; padding: 40px; background: #0d1117; display: flex; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box; }

  .og {
    width: 1200px;
    height: 630px;
    background: #0b1120;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    font-family: 'Space Grotesk', sans-serif;
    flex-shrink: 0;
  }

  /* Background grid */
  .og::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(13,212,200,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(13,212,200,.04) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* Radial glow top-right */
  .og::after {
    content: '';
    position: absolute;
    top: -160px;
    right: -100px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(13,212,200,.12) 0%, transparent 65%);
    pointer-events: none;
  }

  /* Left content */
  .left {
    padding: 64px 72px;
    flex: 1;
    position: relative;
    z-index: 1;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #0dd4c8;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow::before { content: ''; display: inline-block; width: 24px; height: 1px; background: #0dd4c8; }

  .brand {
    font-size: 72px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -.03em;
    margin-bottom: 16px;
  }
  .brand-main { color: #dde6f0; }
  .brand-accent { color: #0dd4c8; }

  .tagline {
    font-size: 22px;
    font-weight: 500;
    color: #7a90a8;
    line-height: 1.4;
    max-width: 480px;
    margin-bottom: 36px;
  }
  .tagline strong { color: #dde6f0; font-weight: 600; }

  .pills {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(13,212,200,.3);
    color: #0dd4c8;
    background: rgba(13,212,200,.06);
  }

  /* Right panel */
  .right {
    width: 340px;
    flex-shrink: 0;
    padding: 48px 48px 48px 0;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .stat-card {
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .stat-icon { font-size: 22px; flex-shrink: 0; }
  .stat-num { font-size: 20px; font-weight: 800; color: #dde6f0; letter-spacing: -.03em; line-height: 1; }
  .stat-label { font-size: 11px; color: #7a90a8; margin-top: 2px; font-family: 'JetBrains Mono', monospace; letter-spacing: .05em; }

  /* Divider */
  .vdivider {
    position: absolute;
    left: 840px;
    top: 60px;
    bottom: 60px;
    width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(13,212,200,.2) 30%, rgba(13,212,200,.2) 70%, transparent);
    z-index: 1;
  }

  /* URL footer */
  .url-bar {
    position: absolute;
    bottom: 32px;
    left: 72px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: #3d5166;
    letter-spacing: .05em;
    z-index: 1;
  }
  .url-bar span { color: #0dd4c8; }
</style>
</head>
<body>
<div class="og">
  <div class="left">
    <div class="eyebrow">Cybersecurity Career Platform</div>
    <div class="brand">
      <span class="brand-main">InfoSec</span><span class="brand-accent">Deck</span>
    </div>
    <div class="tagline">
      <strong>Break in. Level up. Get hired.</strong><br>
      The free career guide built for security practitioners.
    </div>
    <div class="pills">
      <div class="pill">15 Domains</div>
      <div class="pill">80+ Certs</div>
      <div class="pill">AI Resume Review</div>
      <div class="pill">Free</div>
    </div>
  </div>

  <div class="vdivider"></div>

  <div class="right">
    <div class="stat-card">
      <div class="stat-icon">🗂️</div>
      <div>
        <div class="stat-num">15</div>
        <div class="stat-label">Security Domains</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">📜</div>
      <div>
        <div class="stat-num">80+</div>
        <div class="stat-label">Certifications Mapped</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🔥</div>
      <div>
        <div class="stat-num">AI</div>
        <div class="stat-label">Resume Roaster Pro</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">💰</div>
      <div>
        <div class="stat-num">$0</div>
        <div class="stat-label">To Get Started</div>
      </div>
    </div>
  </div>

  <div class="url-bar"><span>infosecdeck</span>.com</div>
</div>
</body>
</html>
